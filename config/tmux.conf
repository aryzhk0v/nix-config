# Core behavior
set-option -g renumber-windows on

#osc52
set-option -g set-clipboard on
set-option -g allow-passthrough on
set -s set-clipboard external
set -as terminal-features ',screen-256color:clipboard'

# Update DISPLAY on attach when the machine-local helper is available.
if-shell 'test -x ~/.scripts/update_display.sh' \
	'set-hook -g client-attached "run-shell ~/.scripts/update_display.sh"'

# Copy mode and clipboard
bind-key Escape copy-mode
bind-key C-c copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection -x

# Integrate the X11 clipboard without installing broken bindings on systems
# where xsel is unavailable.
if-shell 'command -v xsel >/dev/null 2>&1' \
	'bind-key -T copy-mode-vi y send-keys -X copy-pipe "xsel -i -b"' \
	'bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel'
if-shell 'command -v xsel >/dev/null 2>&1' \
	'bind-key p run-shell "xsel -o -b | tmux load-buffer - ; tmux paste-buffer"' \
	'bind-key p paste-buffer -p'

bind-key -n M-m if-shell -F '#{mouse}' \
	'set-option -g mouse off; display-message "mouse: off"' \
	'set-option -g mouse on; display-message "mouse: on"'

bind-key -n PPage copy-mode \; send-keys -X page-up
bind-key -n NPage copy-mode \; send-keys -X page-down

# Hide pane entries from the prefix+w tree view.
bind-key w choose-tree -F '#{window_name}'

# Status bar
set-option -g status-interval 1
set-option -g display-time 4000
set-option -g message-style 'fg=white,bg=black,bright'
set-option -g status-position top
set-option -g status-style 'fg=colour142,bg=black'
set-option -g status-left '[#S]'
set-option -g status-right '#H'

set-option -g window-status-format ' #I #W #F'
set-option -g window-status-current-format ' #I #W #F'
set-option -g window-status-separator ' '
set-option -g window-status-current-style 'bg=colour142,fg=black'

set-option -g set-titles on
set-option -g set-titles-string '#T'

# Show each pane's TTY along its lower border.
set-option -g pane-border-status bottom
set-window-option -g pane-border-format '#{pane_tty}'
